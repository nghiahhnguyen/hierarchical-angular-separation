[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-angular-separation"
version = "0.1.0"
description = "Reproduce HAS measurements and synthetic InfoNCE experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "networkx>=3,<4", "matplotlib>=3.8,<4", "tqdm>=4.66", "pillow>=10"]

[project.optional-dependencies]
experiments = ["torch==2.5.0", "torchvision==0.20.0", "open_clip_torch==2.26.1", "pandas>=2,<3", "mlflow>=2.17,<3", "sqlalchemy<2.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["has*", "synthetic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
